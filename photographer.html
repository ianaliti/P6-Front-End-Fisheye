<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fisheye - photographe</title>
  <link rel="icon" type="image/png" href="assets/images/icon/favicon.png">
  <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <header class="header">
    <a href="./index.html" aria-label="Page d'accueil">
      <img src="assets/images/logo/logo.png" class="logo" alt="fisheye logo">
    </a>
  </header>

  <main class="main">
    <section>
      <div class="photograph-header">
        <div class="photograph-profile" role="region" aria-label="Profil du photographe"></div>
        <button class="contact_button" onclick="displayModal()" aria-label="Ouvrir la fenêtre de contact" tabindex="0">Contactez-moi</button>
        <div class="image-profile"></div>
      </div>

      <div class="sort_by">
        <h4 id="dropdown-label" class="sort_title">Trier par</h4>
        <ul class="dropdown" aria-labelledby="dropdown-label">
          <li><span class="fa-solid fa-chevron-up"></span></li>
          <li aria-haspopup="true" aria-expanded="false" aria-controls="dropdown-list" id="dropdown-selected" tabindex="0">Popularité</li>
          <li aria-expanded="false" class="dropdown-list-container" id="dropdown-list">
            <ul class="dropdown-list" role="menu">
              <li class="dropdown-button-value" id="option-1" role="menuitem" tabindex="0" aria-label="Popularity, allows sorting media by popularity">Popularité</li>
              <li class="dropdown-button-value" id="option-2" role="menuitem" tabindex="0" aria-label="Date, allows sorting media by date">Date</li>
              <li class="dropdown-button-value" id="option-3" role="menuitem" tabindex="0" aria-label="Title, allows sorting media by title">Titre</li>
            </ul>
          </li>
        </ul>
      </div>

      <div class="media-content">
        <div class="medias"></div>
      </div>

      <div class="modal-img">
        <span class="close" aria-label="Fermer la lightbox" role="button" tabindex="0"><i class="fas fa-times"></i></span>
        <div class="modalContent">
            <div class="modal-image-button">
                <button type="button" class="image-button back" aria-label="Revenir au média précédent">
                    <i class="fa-solid fa-chevron-left fa-2xl"></i>
                </button>
                <div class="image-txt">
                    <img src="" class="modalImg" alt="" style="display: none;">
                    <video src="" class="modalVideo" controls style="display: none;"></video>
                    <span class="modalTxt"></span>
                </div>
                <button type="button" class="image-button next" aria-label="Aller au média suivant">
                    <i class="fa-solid fa-chevron-right fa-2xl"></i>
                </button>
            </div>
        </div>
    </div>
    </section>

    <div class="total-likes"></div>
  </main>

  <!-- Contact Modal Section -->
  <section class="modal-section" tabindex="-1" aria-label="Contact Modal">
    <div id="contact_modal">
      <div class="modal" role="dialog" aria-labelledby="contact-modal-title" aria-modal="true" tabindex="0">
        <header>
          <h2 id="contact-modal-title" tabindex="0">Contactez-moi <br><strong class="modal-photographer-name"></strong></h2>
          <img src="assets/icons/close.svg" alt="Icone pour fermer la fenêtre" role="button" tabindex="0" aria-label="Bouton pour fermer la fenêtre de contact" onclick="closeModal()">
        </header>
        <form name="form" action="photographer.html" method="post" aria-labelledby="contact-modal-title">
          <div class="formData">
            <label for="first" id="label-first">Prénom</label><br>
            <input class="text-control" type="text" id="first" name="first" aria-labelledby="label-first" aria-label="Champ pour entrer votre prénom" tabindex="0"><br>
          </div>
          <div class="formData">
            <label for="last" id="label-last">Nom</label><br>
            <input class="text-control" type="text" id="last" name="last" aria-labelledby="label-last" aria-label="Champ pour entrer votre nom de famille" tabindex="0"><br>
          </div>
          <div class="formData">
            <label for="email" id="label-email">E-mail</label><br>
            <input class="text-control" type="email" id="email" name="email" aria-labelledby="label-email" aria-label="Champ pour entrer votre adresse e-mail" tabindex="0"><br>
          </div>
          <div class="formData">
            <label for="textarea" id="label-message">Votre message</label><br>
            <textarea name="message" id="textarea" rows="5" aria-labelledby="label-message" aria-label="Champ pour entrer votre message" placeholder="Entrez ici votre message"></textarea><br>
          </div>
          <button type="submit" class="contact_button" aria-label="Bouton pour envoyer le formulaire de contact" tabindex="0">Envoyer</button>
        </form>
      </div>
    </div>
  </section>

  <section class="confirmModal" aria-label="Success Modal" style="display: none;">
    <div class="confirmModalContent" role="dialog" aria-labelledby="success-modal-title" aria-modal="true" tabindex="0">
      <span class="closeModal" role="button" tabindex="0" aria-label="Bouton pour fermer la fenêtre de confirmation"></span>
      <p class="confirmModalText" id="success-modal-title" tabindex="0">Merci pour votre inscription</p>
      <button class="confirmModalClose button" aria-label="Bouton pour fermer la fenêtre de confirmation" tabindex="0">Fermer</button>
    </div>
  </section>

  <script type="module" src="scripts/utils/fetchData.js"></script>
  <script type="module" src="scripts/utils/contactForm.js"></script>
  <script type="module" src="scripts/utils/dropdown.js"></script>
  <script type="module" src="scripts/utils/likesTotal.js"></script>
  <script type="module" src="scripts/utils/lightbox.js"></script>
  <script type="module" src="scripts/factories/ComponentFactory.js"></script>
  <script type="module" src="scripts/factories/PhotographerFactory.js"></script>
  <script type="module" src="scripts/factories/MediaFactory.js"></script>
  <script type="module" src="scripts/templates/photographerProfile.js"></script>
  <script type="module" src="scripts/templates/ImageMedia.js"></script>
  <script type="module" src="scripts/templates/VideoMedia.js"></script>
  <script type="module" src="scripts/pages/photographer.js"></script>
</body>
</html>
